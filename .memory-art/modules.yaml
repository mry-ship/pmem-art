    category: misc
    status: candidate
    description: 由 classify/ingest 自动扩展 · confidence=0.4 · reason=unknown_low_signal
    paths:
      - "assets/misc/random/**"
    aliases:
      - Random
    entities: []
    palette: []
    specs:
      resolution: 640x480
      alpha_required: false
      max_size_kb: 2048
