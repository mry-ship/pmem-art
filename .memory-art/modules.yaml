# pmem-art modules.yaml — status: scaffold | candidate | active
# scaffold = 冷启动空壳（引导落盘路径）; candidate = sync 自动提议（待 accept）; active = 已确认生效
schema_version: 1
categories:
  brand:
    label: "全局风格圣经 (Brand & Style Bible)"
    icon: 🎨
  character:
    label: "角色与立绘绑定 (Character & Rigging)"
    icon: 🧝‍♀️
  scene:
    label: "场景与地块物件 (Scene & Environment)"
    icon: 🏯
  ui:
    label: "界面与九宫格图标 (UI & 9-Slice HUD)"
    icon: 💠
  vfx:
    label: "特效与序列帧表现 (VFX & Shaders)"
    icon: ✨
  misc:
    label: 未归类 / 待提升 (Misc)
    icon: 📦
synonyms:
  -
    - 立绘
    - 半身像
    - 全身像
    - portrait
    - sprite
  -
    - 九宫格
    - 9-slice
    - 拉伸框
    - 弹窗底板
  -
    - 去背
    - 透明通道
    - alpha
    - 抠图
    - 白边
  -
    - 废案
    - 红线
    - 打回
    - redline
    - "don't"
  -
    - 配方
    - 工作流
    - lora
    - prompt
    - comfyui
    - seed
modules:
  brand.WorldStyle:
    title: 全局世界观色彩圣经与光影红线
    category: brand
    description: 定义全项目 70/20/10 东方青瓷鎏金色彩比例、统一笔触质感、全局禁用赛博霓虹色系及通用 Negative Prompts
    paths:
      - "assets/brand/**"
    aliases:
      - StyleGuide
      - ColorBible
      - 色彩圣经
      - 全局风格
    entities:
      - ColorRatio
      - BrushStroke
      - LightingRule
      - GlobalNegative
    palette:
      - { hex: "#0F172A", name: "玄青夜色 (70% 暗部主基调)", role: primary_dark }
      - { hex: "#1E3A4B", name: "远山黛蓝 (70% 辅助环境面)", role: secondary_dark }
      - { hex: "#2DD4BF", name: "秘色青瓷 (20% 灵脉/高光漫射)", role: secondary_accent }
      - { hex: "#F4F1EA", name: "宣纸暖白 (20% 服饰/云石亮面)", role: neutral_light }
      - { hex: "#F59E0B", name: "鎏金符文 (10% 视觉焦点点睛)", role: accent_gold }
      - { hex: "#E11D48", name: 朱砂绛红 (受击/警示专用), role: danger }
    specs:
      resolution: 1024x576
      aspect_ratio: "16:9"
      alpha_required: false
      color_space: sRGB
      max_size_kb: 2048
    status: active
  character.Astra:
    title: 核心主角·阿斯特拉 (星盘司辰)
    category: character
    description: 7.5头身东方星盘术士立绘、正侧背三视图、左眼黄铜星盘义眼特征与 Spine 8层拆分规范
    paths:
      - "assets/character/astra_standing*.png"
      - "assets/character/astra_rejected*.png"
      - "assets/character/astra_turnaround*.png"
      - "workflows/comfyui_astra*.json"
    aliases:
      - Astra
      - 阿斯特拉
      - 主角立绘
      - 司辰
    entities:
      - Proportions
      - CostumeDesign
      - AstrolabeMonocle
      - SpineLayering
      - Turnaround
    palette:
      - { hex: "#0F172A", name: 外袍玄青, role: cloak }
      - { hex: "#F4F1EA", name: 内衬宣纸白, role: tunic }
      - { hex: "#2DD4BF", name: 青瓷灵玉佩, role: jade }
      - { hex: "#F59E0B", name: 左眼星盘义眼/金边, role: gold_trim }
      - { hex: "#E2E8F0", name: 月白银发, role: hair }
    specs:
      resolution: 1024x1024
      allowed_resolutions:
        - 1024x1024
        - 2048x1024
      aspect_ratio: "1:1"
      alpha_required: true
      premultiplied_alpha: true
      safe_margin_px: 16
      max_size_kb: 1024
    status: active
  character.Astra.Expressions:
    title: 阿斯特拉·剧情表情差分组
    category: character
    parent: character.Astra
    description: 继承 character.Astra 头身与五官规范，专管 AVG 对话框表情差分（平静/战斗/微哂/受击/惊愕）及眼部发光层拆分
    paths:
      - "assets/character/astra_expr*.png"
    aliases:
      - AstraExpressions
      - 阿斯特拉表情
      - 表情差分
    entities:
      - ExpressionSheet
      - EyeGlowLayer
      - MouthSync
    palette:
      - { hex: "#2DD4BF", name: 常态青瓷瞳光, role: calm_glow }
      - { hex: "#F59E0B", name: 觉醒鎏金瞳光, role: battle_glow }
      - { hex: "#E11D48", name: 受击朱砂瞳光, role: damaged_glow }
    specs:
      resolution: 1024x1024
      allowed_resolutions:
        - 1024x1024
      aspect_ratio: "1:1"
      alpha_required: true
      max_size_kb: 1024
    status: active
  scene.FloatingRuins:
    title: 第一幕场景·浮空星盘遗迹
    category: scene
    description: 30°等轴测浮空遗迹概念图、左上45°暖金主光与冷黛环境阴影规范、白玉断柱与青瓷法阵地表
    paths:
      - "assets/scene/**"
    aliases:
      - FloatingRuins
      - 浮空遗迹
      - 星盘遗迹
    entities:
      - LightingDirection
      - IsometricCamera
      - ArchitectureProp
    palette:
      - { hex: "#1E3A4B", name: 浮岛背光岩层, role: rock_shadow }
      - { hex: "#F4F1EA", name: 汉白玉台面, role: marble_lit }
      - { hex: "#F59E0B", name: 左上45°斜射天光, role: sun_keylight }
      - { hex: "#2DD4BF", name: 地表星轨法阵, role: rune_glow }
    specs:
      resolution: 1024x576
      allowed_resolutions:
        - 1024x576
        - 1920x1080
      aspect_ratio: "16:9"
      alpha_required: false
      max_size_kb: 2048
    status: active
  ui.InventoryHUD:
    title: 背包与通用弹窗九宫格组件
    category: ui
    description: 512x512 九宫格（9-Slice）弹窗底板、48px 四角黄铜包角固定区、中央纯色拉伸区禁画暗纹红线与 4px 透明安全边距
    paths:
      - "assets/ui/**"
      - "workflows/comfyui_ui*.json"
    aliases:
      - InventoryHUD
      - UI弹窗
      - 九宫格底板
    entities:
      - NineSliceRule
      - OuterMargin
      - CornerOrnament
    palette:
      - { hex: "#0F172A", name: "面板底色 (95% 不透明度)", role: panel_bg }
      - { hex: "#F59E0B", name: 四角黄铜镶边, role: corner_frame }
      - { hex: "#2DD4BF", name: 内层1px青瓷辉光边, role: inner_stroke }
    specs:
      resolution: 512x512
      allowed_resolutions:
        - 512x512
      aspect_ratio: "1:1"
      alpha_required: true
      nine_slice:
        - 48
        - 48
        - 48
        - 48
      safe_margin_px: 4
      max_size_kb: 512
    status: active
  vfx.ArcaneSlash:
    title: 战斗特效·星轨秘色刀光序列帧
    category: vfx
    description: 1024x512 四帧横排刀光序列帧（单帧 256x512）、外青瓷内鎏金双层色阶、预乘透明通道（Premultiplied Alpha）禁黑边规范
    paths:
      - "assets/vfx/**"
    aliases:
      - ArcaneSlash
      - 星轨刀光
      - 技能序列帧
    entities:
      - SpriteSheetGrid
      - AlphaBlend
      - ColorRamp
    palette:
      - { hex: "#F4F1EA", name: 刀刃核心极亮白, role: core_hot }
      - { hex: "#F59E0B", name: 中层鎏金剑气, role: mid_gold }
      - { hex: "#2DD4BF", name: 外层青瓷残影消散, role: outer_fade }
    specs:
      resolution: 1024x512
      allowed_resolutions:
        - 1024x512
      aspect_ratio: "2:1"
      alpha_required: true
      premultiplied_alpha: true
      max_size_kb: 1024
    status: active
  vfx.Nova:
    title: Nova (vfx)
    category: vfx
    status: active
    description: 由 classify/ingest 自动扩展 · confidence=0.92 · reason=new_module_from_signals
    paths:
      - "assets/vfx/nova/**"
    aliases:
      - Nova
    entities: []
    palette: []
    specs:
      resolution: 1024x256
      alpha_required: true
      safe_margin_px: 16
      max_size_kb: 1024
  misc.Random:
