<section><h2>案例 01 · 仙侠不夜城</h2><div class="row"><figure class="card ref">

  <div class="reason">屋脊上的孤影与延伸至天际的灯火营造出极有吸引力的宏大幽暗意境，但远处城池的纹理略显重复、暗部有些糊成一片，离我愿意直接收下的成品还差一点清晰而独特的刻画。</div>
  <div class="dims">Absolute-5D 五维均分 8.26</div>
  
</figure><figure class="card">

  <div class="dims">Absolute-5D 档位加权 8.32</div>
  <details><summary>本档提示词</summary><p>仙侠水墨夜色风：锁视角与姿态，仅微修局部质感 | 仙侠水墨夜色风：保持俯瞰孤侠背影站位，微修质感 | 低强度修瑕 (low ≤20%): 保持俯瞰孤侠背影站位，仅精修局部质感；仙侠水墨夜色风 | 最优方向：近景瓦当咬合与剑身细冷钢高光微锐 | 约束：保持原图画风笔触与色板；不改男侠背影站位与俯瞰构图；严禁增删飞檐楼阁与暖金灯笼布局；保持原图男性持剑侠客身份，禁止改成女侠</p></details>

  <div class="dims">Absolute-5D 档位加权 8.46</div>

  <div class="reason">灯火铺展的古城与屋脊上的孤身人物营造出很强的仙侠史诗感，但建筑和光点过于密集重复，蓝色光带也略显刻意，离我愿意直接收下的成品还差一点克制。</div>

  <div class="dims">Absolute-5D 五维均分 8.46</div>

</figure></div></section><section><h2>案例 02 · 粉彩速写少女</h2><div class="row"><figure class="card ref">
