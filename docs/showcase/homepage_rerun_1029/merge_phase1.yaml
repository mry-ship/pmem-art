      - { level: 6, name: 王冠糖, silhouette: 嵌宝糖顶长出小冠, scale_delta: "+大", scale_pct: 0.75, parts_add: 长在糖上的王冠 }
      - { level: 7, name: 星冠糖, silhouette: 王冠糖冠上加星尖, scale_delta: "+大", scale_pct: 0.77, parts_add: 冠上星尖 }
