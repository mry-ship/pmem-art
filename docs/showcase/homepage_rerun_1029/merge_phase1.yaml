# homepage 1029 合成梯关系稿。不改 canonical 已有 track。
version: homepage-1029
pipeline: art-merge-two-phase
tracks:
  heal_potion:
    module: prop.HealPotionMerge
    mode: A
    surface: 同族矮切面玻璃卡通药瓶，灰棚空底只有接触影，无木托无桌面无包装；无脸无等级字
