      - { level: 7, name: 晶冠瓶, silhouette: 金足瓶塞上加晶冠, scale_delta: "+大", scale_pct: 0.77, parts_add: 塞顶晶冠 }
      - { level: 8, name: 神瓶, silhouette: 晶冠瓶加光环沿, scale_delta: "+大", scale_pct: 0.79, parts_add: 冠沿光环；全梯最大 }

  peach_candy:
    module: prop.PeachCandyMerge
    mode: B
    surface: 同族蜜桃软糖卡通，零件长在糖上；灰棚或米白空底只有接触影；不裹糖纸、不上纸托、不摆托盘丝带；无脸无等级字
    rows:
      - { level: 1, name: 小软糖, silhouette: 小蜜桃软糖裸糖, scale_delta: 基档, scale_pct: 0.60, parts_add: "—" }
      - { level: 2, name: 胖软糖, silhouette: 更胖的同色软糖, scale_delta: "+小", scale_pct: 0.63, parts_add: 糖体加厚 }
      - { level: 3, name: 糖霜, silhouette: 胖糖表面结一层糖霜, scale_delta: "+小", scale_pct: 0.66, parts_add: 表面糖霜 }
      - { level: 4, name: 叶片, silhouette: 糖霜糖上长出叶片, scale_delta: "+中", scale_pct: 0.69, parts_add: 长在糖上的叶 }
