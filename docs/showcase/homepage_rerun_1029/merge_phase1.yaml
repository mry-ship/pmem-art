      - { level: 1, name: 空瓶, silhouette: 矮切面玻璃瓶无塞无药, scale_delta: 基档, scale_pct: 0.60, parts_add: "—" }
      - { level: 2, name: 加塞空瓶, silhouette: 同瓶加软木塞仍空, scale_delta: "+小", scale_pct: 0.63, parts_add: 软木塞 }
      - { level: 3, name: 半药, silhouette: 加塞半瓶青绿药液, scale_delta: "+小", scale_pct: 0.66, parts_add: 半瓶药液 }
      - { level: 4, name: 满药, silhouette: 加塞满瓶青绿药液, scale_delta: "+中", scale_pct: 0.69, parts_add: 满瓶药液 }
      - { level: 5, name: 签环叶饰, silhouette: 满药瓶颈加纸签环与叶, scale_delta: "+中", scale_pct: 0.72, parts_add: 纸签环与叶饰 }
