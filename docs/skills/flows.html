<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pmem-art · 技能流程</title>
  <style>
    :root {
      --bg: #f7f6f3;
      --card: #fff;
      --ink: #1c1b19;
      --muted: #6b6760;
      --line: #ddd8ce;
      --blue: #3b6fd9;
      --ok: #2a8a55;
      --bad: #c2453a;
      --mem: #7a5cc8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    header {
      max-width: 880px;
      margin: 0 auto;
      padding: 28px 20px 8px;
    }
    header h1 { font-size: 1.45rem; font-weight: 600; margin: 0 0 6px; }
    header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    header a { color: var(--blue); }
    main { max-width: 880px; margin: 0 auto; padding: 12px 20px 48px; }
    .pick {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0 20px;
    }
    .pick button {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .pick button[aria-pressed="true"] {
      border-color: var(--blue);
      background: color-mix(in srgb, var(--blue) 12%, white);
      color: var(--blue);
      font-weight: 600;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .legend span::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 6px;
      vertical-align: -1px;
    }
    .l-blue::before { background: var(--blue); }
    .l-ok::before { background: var(--ok); }
    .l-bad::before { background: var(--bad); }
    .l-mem::before { background: var(--mem); }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 14px 10px;
    }
    .panel h2 { margin: 0 0 2px; font-size: 1.1rem; font-weight: 600; }
    .panel .sub { margin: 0 0 14px; color: var(--muted); font-size: 0.88rem; }
    #svg-host svg { width: 100%; height: auto; display: block; }
    .flow-node rect {
      stroke: var(--ink);
      stroke-width: 1.4;
    }
    .flow-node text { fill: var(--ink); font-size: 13px; }
    .flow-label { fill: var(--muted); font-size: 11px; }
    .flow-edge {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.5;
      marker-end: url(#arrow);
    }
    .flow-edge-return { stroke: var(--bad); stroke-dasharray: 5 4; }
    .n-blue rect { fill: color-mix(in srgb, var(--blue) 16%, white); }
    .n-ok rect { fill: color-mix(in srgb, var(--ok) 16%, white); }
    .n-bad rect { fill: color-mix(in srgb, var(--bad) 14%, white); }
    .n-mem rect { fill: color-mix(in srgb, var(--mem) 14%, white); }
    .n-neu rect { fill: #f0eee8; }
    .hint {
      margin-top: 18px;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .hint code {
      font-size: 0.84rem;
      background: #eeeae2;
      padding: 1px 5px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header>
    <h1>pmem-art · 技能流程</h1>
    <p>现在是 8 个技能。原画、克隆、变体、镜头包收在 draw 里；合成梯先过关系，再一档一张，同框不是成品。完整说明见 <a href="../../USER_MANUAL.md">USER_MANUAL.md · 第一章附</a>。</p>
  </header>
  <main>
    <div class="pick" id="pick" role="group" aria-label="选择技能"></div>
    <div class="legend" aria-hidden="true">
      <span class="l-blue">生图 / 提案</span>
      <span class="l-ok">过线 / 交付</span>
      <span class="l-bad">回流修正</span>
      <span class="l-mem">记忆静默</span>
    </div>
    <div class="panel">
      <h2 id="title">/pmem-draw</h2>
      <p class="sub" id="sub">别名 /art-draw · 通用生图</p>
      <div id="svg-host" role="img" aria-labelledby="title aria"></div>
      <p id="aria" class="visually-hidden" style="position:absolute;left:-9999px"></p>
    </div>
    <p class="hint">强制收敛类统一：最多 4 轮、合格线 <code>≥ 9.6</code>；履历可见、记忆静默。进阶 peek 日常不用喊，<code>finish</code> 已后台跑过。</p>

  const order = ["draw","concept","ui","icon","clone","ladder","lens","style","critique","variant","atlas","improve","coach","learn"];
  const pick = document.getElementById("pick");
  const host = document.getElementById("svg-host");
  const titleEl = document.getElementById("title");
  const subEl = document.getElementById("sub");
  const ariaEl = document.getElementById("aria");
  let current = "draw";

  order.forEach((key) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = SKILLS[key].label;
    btn.setAttribute("aria-pressed", key === current ? "true" : "false");
    btn.addEventListener("click", () => {
      current = key;
      [...pick.children].forEach((b) => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
      render(key);
    });
    pick.appendChild(btn);
  });

  function nodeCenter(n) { return { x: n.x + n.w / 2, y: n.y + n.h / 2 }; }
  function edgePoint(n, toward) {
    const c = nodeCenter(n);
    const dx = toward.x - c.x, dy = toward.y - c.y;
    if (Math.abs(dx) * n.h > Math.abs(dy) * n.w) {
      return { x: c.x + (dx > 0 ? 1 : -1) * (n.w / 2), y: c.y };
    }
    return { x: c.x, y: c.y + (dy > 0 ? 1 : -1) * (n.h / 2) };
  }

  function render(key) {
    const skill = SKILLS[key];
    titleEl.textContent = skill.title;
    subEl.textContent = skill.sub;
    ariaEl.textContent = skill.aria;
    const byId = Object.fromEntries(skill.nodes.map((n) => [n.id, n]));
    let maxY = 0;
    skill.nodes.forEach((n) => { maxY = Math.max(maxY, n.y + n.h); });
    const parts = ['<svg viewBox="0 0 736 ' + (maxY + 36) + '" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b6760"/></marker></defs>'];
    skill.edges.forEach((e) => {
      const a = byId[e[0]], b = byId[e[1]];
      if (!a || !b) return;
      const isRet = e[3] === true;
      const p1 = edgePoint(a, nodeCenter(b)), p2 = edgePoint(b, nodeCenter(a));
      let d;
      if (isRet) {
        const midY = Math.max(p1.y, p2.y) + 36;
        d = "M" + p1.x + " " + p1.y + " L" + p1.x + " " + midY + " L" + p2.x + " " + midY + " L" + p2.x + " " + p2.y;
      } else {
        d = "M" + p1.x + " " + p1.y + " L" + p2.x + " " + p2.y;
      }
      parts.push('<path class="flow-edge' + (isRet ? " flow-edge-return" : "") + '" d="' + d + '"/>');
      if (e[2]) {
        const mx = (p1.x + p2.x) / 2;
        const my = isRet ? Math.max(p1.y, p2.y) + 28 : (p1.y + p2.y) / 2 - 6;
        parts.push('<text class="flow-label" x="' + mx + '" y="' + my + '" text-anchor="middle">' + e[2] + "</text>");
      }
    });
    skill.nodes.forEach((n) => {
      parts.push('<g class="flow-node ' + n.c + '"><rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="8"/><text x="' + (n.x + n.w / 2) + '" y="' + (n.y + 20) + '" text-anchor="middle" font-weight="600">' + n.t1 + '</text><text class="flow-label" x="' + (n.x + n.w / 2) + '" y="' + (n.y + 36) + '" text-anchor="middle">' + n.t2 + "</text></g>");
    });
    parts.push("</svg>");
    host.innerHTML = parts.join("");
  }

  render(current);
})();
  </script>
