<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Mode C 道具格</title>
<style>
  body { margin: 0; font: 14px/1.4 sans-serif; background: #1a120c; color: #f3e4c4; }
  main { padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: #c4a57a; }
  .row { display: flex; gap: 28px; align-items: flex-end; margin: 0 0 28px; flex-wrap: wrap; }
  figure { margin: 0; }
  figcaption { margin-top: 6px; font-size: 12px; }
  .light { background: #f3e4c4; color: #1c140e; padding: 12px; }
  .dark { background: #1c140e; padding: 12px; }
  img { display: block; }
  img.x1 { width: 64px; height: 64px; }
  img.x2 { width: 128px; height: 128px; }
</style>
</head>
<body>
<main>
  <h1>道具格 · 1x / 2x · 深浅底</h1>
  <p>线宽 10px@256 · 圆角 16px · 暖黑描边 · 接触投影。文件带 alpha。</p>
  <div class="row dark">
    <figure><img class="x1" src="heal_64.png" alt="治疗药 64"><figcaption>治疗 1x</figcaption></figure>
    <figure><img class="x2" src="heal_128.png" alt="治疗药 128"><figcaption>治疗 2x</figcaption></figure>
    <figure><img class="x1" src="mana.png" alt="法力药"><figcaption>法力 1x</figcaption></figure>
    <figure><img class="x2" src="mana.png" alt="法力药 2x"><figcaption>法力 2x</figcaption></figure>
    <figure><img class="x1" src="key.png" alt="钥匙"><figcaption>钥匙 1x</figcaption></figure>
    <figure><img class="x2" src="key.png" alt="钥匙 2x"><figcaption>钥匙 2x</figcaption></figure>
    <figure><img class="x1" src="ruby.png" alt="宝石"><figcaption>宝石 1x</figcaption></figure>
    <figure><img class="x2" src="ruby.png" alt="宝石 2x"><figcaption>宝石 2x</figcaption></figure>
    <figure><img class="x1" src="scroll.png" alt="卷轴"><figcaption>卷轴 1x</figcaption></figure>
    <figure><img class="x2" src="scroll.png" alt="卷轴 2x"><figcaption>卷轴 2x</figcaption></figure>
  </div>
  <div class="row light">
    <figure><img class="x1" src="heal_64.png" alt="治疗药浅底"><figcaption>治疗 1x</figcaption></figure>
    <figure><img class="x2" src="heal_128.png" alt="治疗药浅底 2x"><figcaption>治疗 2x</figcaption></figure>
    <figure><img class="x1" src="mana.png" alt="法力药浅底"><figcaption>法力 1x</figcaption></figure>
    <figure><img class="x2" src="mana.png" alt="法力药浅底 2x"><figcaption>法力 2x</figcaption></figure>
    <figure><img class="x1" src="key.png" alt="钥匙浅底"><figcaption>钥匙 1x</figcaption></figure>
    <figure><img class="x2" src="key.png" alt="钥匙浅底 2x"><figcaption>钥匙 2x</figcaption></figure>
    <figure><img class="x1" src="ruby.png" alt="宝石浅底"><figcaption>宝石 1x</figcaption></figure>
    <figure><img class="x2" src="ruby.png" alt="宝石浅底 2x"><figcaption>宝石 2x</figcaption></figure>
    <figure><img class="x1" src="scroll.png" alt="卷轴浅底"><figcaption>卷轴 1x</figcaption></figure>
    <figure><img class="x2" src="scroll.png" alt="卷轴浅底 2x"><figcaption>卷轴 2x</figcaption></figure>
  </div>
</main>
</body>
</html>
