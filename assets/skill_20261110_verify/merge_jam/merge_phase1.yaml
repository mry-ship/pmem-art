# 露莓果酱八档 · 冲 9.5 主链改稿
# 主链只走果酱加工：整莓→剖碟→酱碗→果酱罐→礼罐→单片涂酱吐司→托盘套装→果酱三明治
# 果汁/冰沙移出主链（避免酱泥↔清汁、冰沙↔熬酱倒推不通）
# L7/L8 对标 GH Bread：Toast with Butter and Jam → Jelly Sandwich
# 竖屏 4×2；Gossip Harbor 玩具货柜卡通；浅色卡；不凑框高
version: dewberry-jam-verify-lightcard-20261110-r2chain
pipeline: art-merge-two-phase
delivery: overview_sheet

tracks:
  dewberry_jam:
    module: merge.DewberryJam
    chain_mode: shop_ladder
    levels: 8
    grid_rows: 4
    grid_cols: 2
    surface: "Gossip Harbor 玩具货柜卡通——光泽卡通3D、圆润厚实、无硬描边、暖饱和、柔光渐变、糖釉玩具高光、棋盘缩略可认；材质锁死卡通玩具/糖釉道具不是实物；露莓洋红+叶绿+奶油酱色相；竖屏4×2浅奶油/浅蓝圆角卡（禁止纯黑整表底）；同一3/4俯视同一柔光左上；每格一件居中留边无等级字；道具无脸；禁止写实摄影、美食棚拍、产品静物、玻璃真实折射、木纹指纹、果汁乳浊摄影感、微距毛孔；禁止恐洞疱疹丘、油腻岩浆泡沫、脏粉稠浆、巨型莓瘤丘、紫色布丁断链、后抠"
    commercial_ref: "GH Bread 末段 Toast with Butter and Jam→Jelly Sandwich；本链主线=整莓→剖碟→酱碗→果酱罐→丝带礼罐→单片涂酱吐司→托盘果酱吐司套装→果酱三明治；果汁/冰沙不进主链；抽剪影/件数/容器分档"
    process_type: shop_ladder_same_shop_jam_process
