# 水果店「橙子甜品」合成梯 · shop_ladder L1–L8（overview_sheet 4×2 竖屏）
# 第 1 稿。不写 base_body。
# 过程类型：A 同族形变货柜（同店完整 SKU 换代）。橙子果品→果汁→甜品完成态。
# 商业对标真链（Gossip Harbor 橙子甜品 8，点名水果默认跟此真档序）：
#   Orange → Slice → Wedge → Juice → Smoothie → Cake → Tart → Dessert
# 抽链型=同店形变换代；抽曲线=整果→切片→瓣块→杯装汁→冰沙→蛋糕→挞→盛宴甜品。
# 版式：无格子参考 → 默认 4 行 2 列竖屏、浅色圆角卡。
# 风格未点名 → Gossip Harbor 玩具货柜卡通。
# 五问：
# 1 同店=水果甜品货柜；家族=暖橙+奶油黄+叶绿色相。对标是 GH 橙子真档序，不是自拟假名。
# 2 无回退：整圆果→扁圆切片→三角瓣→细高杯汁→更高冰沙杯→圆蛋糕→宽圆挞→盘装盛宴。L8 仍是橙子甜品盛宴。
# 3 无跨店硬跳、无城堡。邻档剪影类不同，64px 可分。
# 4 L1 只是一颗完整橙，杯/蛋糕/挞/盛宴都晚出现。
# 5 每档 merge_why 写两件同级合成后为何变成下一件，可倒推。
version: harbor-orange-fruit-20261111-v1
pipeline: art-merge-two-phase
delivery: overview_sheet

