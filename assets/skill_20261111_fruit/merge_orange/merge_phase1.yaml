    surface: "Gossip Harbor 玩具货柜卡通：光泽卡通 3D、圆润厚实、无硬描边、暖饱和、柔光渐变、糖釉玩具高光、棋盘缩略可认；材质是卡通玩具/糖釉道具，不是实物。禁止写实摄影、美食棚拍、产品静物、玻璃真实折射、木纹指纹、果汁乳浊摄影感、微距毛孔。4×2 浅奶油/浅蓝圆角卡竖屏；每格一件居中留边，无字无脸。家族是水果店暖橙+奶油黄+叶绿色相，不是八档贴同一纹样。不要草莓、西瓜、露莓、果酱瓶、马卡龙、纸杯蛋糕。"
