# 冷饮店「通用冷饮杯装」合成梯 · shop_ladder L1–L8（overview_sheet 4×2 竖屏）
# 第 1 稿。不写 base_body。
# 过程类型：A 同族形变货柜（同店完整 SKU 换代）。空杯→装液→加盖→高杯→罐→壶→犒赏特饮→派对套装。
# 商业对标真链（Gossip Harbor 茶 7 + Decaf Coffee 研究链压缩到 8）：
#   Tea7: Leaf → Cup → Iced Tea → Iced Lemon Tea → Sweet Iced Tea → Teapot → Tea Party Set
#   Coffee研究: 空纸杯 → 装咖啡 → 加盖外带杯 → 瓷杯 → … → 圣代 → 茶壶套装
# 抽链型=同店容器/完成态换代；抽曲线=空杯→敞口冰饮→加盖外带→高杯吸管→柠檬梅森罐→大壶→奶油犒赏杯→双杯派对盘。
# 版式：无格子参考 → 默认 4 行 2 列竖屏、浅色圆角卡。
# 风格未点名 → Gossip Harbor 玩具货柜卡通。
# 五问：
# 1 同店=冷饮外带货柜；家族=冰蓝+柠黄+奶油白+浅薄荷色相。对标是 GH 茶/咖啡真档序，不是自拟假名。
# 2 无回退：空杯→矮圆敞口→矮圆加盖→细高吸管→宽口梅森罐→宽肩大壶→高杯奶油顶→宽托盘双杯。L8 仍是冷饮派对套装。
# 3 无跨店硬跳、无城堡。邻档剪影类不同，64px 可分。
# 4 L1 只是空纸杯，液面/盖/吸管/柠檬/壶嘴/奶油顶/托盘都晚出现。
# 5 每档 merge_why 写两件同级合成后为何变成下一件，可倒推。
