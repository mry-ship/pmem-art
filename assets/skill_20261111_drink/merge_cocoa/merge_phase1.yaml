# 热可可店「同店杯装升级」合成梯 · shop_ladder L1–L8（overview_sheet 4×2 竖屏）
# 第 1 稿。不写 base_body。新开，不复用 merge_cold。
# 过程类型：A 同族形变货柜（同店完整 SKU 换代）。空杯→装液→加盖→瓷杯→奶油搅棒→壶→棉花糖犒赏→派对套装。
# 商业对标真链（Gossip Harbor Decaf Coffee 研究链压缩到 8）：
#   空纸杯 → 装咖啡 → 加盖外带杯 → 瓷杯 → 加碟/搅棒糖 → … → 圣代犒赏 → 茶壶套装
# 抽链型=同店容器/完成态换代；抽曲线=空杯→敞口热可可→加盖外带→瓷杯碟→奶油搅棒杯→可可壶→棉花糖犒赏→派对盘。
# 版式：无格子参考 → 默认 4 行 2 列竖屏、浅色圆角卡。
# 风格未点名 → Gossip Harbor 玩具货柜。
# 五问：
# 1 同店=热可可外带货柜；家族=可可棕+奶油白+焦糖金+浅珊瑚色相。对标是 GH Decaf Coffee 真档序压缩，不是自拟假名。
# 2 无回退：空杯→矮圆敞口→矮圆加盖→瓷杯带碟→高杯奶油搅棒→宽肩壶→棉花糖犒赏杯→托盘双杯。L8 仍是热可可派对套装。
# 3 无跨店硬跳、无城堡。邻档剪影类不同，64px 可分。
# 4 L1 只是空纸杯，液面/盖/碟/奶油/壶嘴/棉花糖/托盘都晚出现。
# 5 每档 merge_why 写两件同级合成后为何变成下一件，可倒推。
