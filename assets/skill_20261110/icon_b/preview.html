<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>icon.b · 妖精花园线性图标</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", "PingFang SC", sans-serif; background: #f3efe4; color: #243028; }
    header { padding: 28px 32px 8px; }
    h1 { font-size: 20px; font-weight: 650; margin: 0 0 6px; }
    p { margin: 0; font-size: 13px; line-height: 1.5; color: #5c6b60; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 20px 32px 36px; }
    .card { background: #fffdf8; border: 1px solid #e4dcc8; border-radius: 16px; padding: 16px 12px 14px; text-align: center; }
    .sizes { display: flex; gap: 14px; justify-content: center; align-items: flex-end; min-height: 52px; color: #2f6a45; }
    .sizes span { display: inline-flex; }
    .sizes svg { width: 100%; height: 100%; }
    .label { margin-top: 10px; font-size: 14px; }
    .meta { margin-top: 2px; font-size: 12px; color: #7d8b80; }
    .dark { margin: 0 32px 32px; padding: 18px 18px 8px; border-radius: 18px; background: #1d3328; color: #e7f2df; }
    .dark p { color: #b7c9b4; padding: 0 8px 12px; }
    .dark .grid { padding: 0 0 18px; }
    .dark .card { background: #274233; border-color: #345544; }
    .dark .sizes { color: #d7e7a8; }
    .dark .meta { color: #9eb5a4; }
  </style>
</head>
<body>
  <header>
    <h1>妖精花园 · Mode B 线性图标</h1>
    <p>Soft · 24×24 · stroke 2 · round/round · currentColor。每张从左到右是 24、32、48。合同尺寸是 24。</p>
  </header>
  <div class="grid" id="grid-light"></div>
  <section class="dark">
    <p>苔色底预览</p>
    <div class="grid" id="grid-dark"></div>
  </section>
  <script>
    const icons = [
      ["home", "家园", `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4.8 11.2 12 4.6l7.2 6.6"/>
  <path d="M7.2 9.4V19.2h9.6V9.4"/>
  <path d="M10.5 19.2V15h3v4.2"/>
</svg>`],
      ["bag", "背包", `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6.4 11.2 7.4 19.2h9.2l1-8"/>
  <path d="M5 11.2h14"/>
  <path d="M8.4 11.2a3.6 6.4 0 0 1 7.2 0"/>
</svg>`],
      ["map", "地图", `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4.8 6.8 8.6 4.8 12 6.8 15.4 4.8 19.2 6.8 19.2 18.8 15.4 16.8 12 18.8 8.6 16.8 4.8 18.8z"/>
  <path d="M8.6 4.8v12"/>
  <path d="M15.4 4.8v12"/>
</svg>`],
      ["shop", "商店", `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4.6 8.2V4.8h14.7v3.4"/>
  <path d="M4.6 8.2c1.6 2.2 3.3 2.2 4.9 0"/>
  <path d="M9.5 8.2c1.6 2.2 3.3 2.2 4.9 0"/>
  <path d="M14.4 8.2c1.6 2.2 3.3 2.2 4.9 0"/>
  <path d="M7 11v8.2h10V11"/>
  <path d="M10.7 19.2V15h2.6v4.2"/>
</svg>`],
      ["quest", "任务", `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M8.2 5.2h8.8c1.2 0 2 .9 2 2v10c0 1.1-.8 2-2 2H8.2"/>
  <path d="M8.2 9.4V15"/>
  <path d="M8.2 5.2c-1.6.2-2.8 1.2-2.6 2.4.2 1.2 1.4 1.8 2.6 1.8"/>
  <path d="M8.2 15c-1.4.1-2.6 1-2.6 2.1s1.2 2.1 2.6 2.1"/>
  <path d="M11 10.4h4.8"/>
  <path d="M11 13.5h3.2"/>
</svg>`],
      ["settings", "设置", `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M9.5 7.2 10.2 4.6 13.8 4.6 14.5 7.2 14.9 7.4 17.5 6.7 19.3 9.9 17.4 11.8 17.4 12.2 19.3 14.1 17.5 17.3 14.9 16.6 14.5 16.8 13.8 19.4 10.2 19.4 9.5 16.8 9.1 16.6 6.5 17.3 4.7 14.1 6.6 12.2 6.6 11.8 4.7 9.9 6.5 6.7 9.1 7.4z"/>
  <circle cx="12" cy="12" r="2.3"/>
</svg>`],
      ["sprout", "种植", `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 19.4V9.6"/>
  <path d="M4.8 19.4h14.4"/>
  <path d="M12 13.6C8.2 14.2 5.6 11.8 6 8.8 8.4 9.4 10.4 11.4 12 12.8"/>
  <path d="M12 11.4C15.8 10.6 18.2 7.8 17.8 4.6 15.2 5.4 13.2 8 12 10.2"/>
</svg>`],
      ["watering-can", "浇水", `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M9.8 12.4h5.6a2 2 0 0 1 2 2v3.2a2 2 0 0 1-2 2H9.8a2 2 0 0 1-2-2v-3.2a2 2 0 0 1 2-2z"/>
  <path d="M7.8 13.8c-2.6-.2-3.4 1.6-3.2 3 .2 1.4 1.6 2 3.2 1.6"/>
  <path d="M11.2 12.4V10.6h2.2"/>
  <path d="M15.8 12.8 18.6 7.2"/>
  <path d="M17.3 6.5 19.9 7.9"/>
</svg>`]
    ];
    function fill(id) {
      const grid = document.getElementById(id);
      for (const [name, label, svg] of icons) {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<div class="sizes">
          <span style="width:24px;height:24px">${svg}</span>
          <span style="width:32px;height:32px">${svg}</span>
          <span style="width:48px;height:48px">${svg}</span>
        </div><div class="label">${label}</div><div class="meta">${name}.svg</div>`;
        grid.appendChild(card);
      }
    }
    fill("grid-light");
    fill("grid-dark");
  </script>
</body>
</html>
