# 妖精花园甜品店「露莓果酱」合成梯 · shop_ladder L1–L8（overview_sheet 2×4）
# 第 1 稿。不写 base_body。
# 过程类型：A 同族形变货柜（同店完整 SKU 换代）。不是原料车间，也不是同底座堆料。
# 商业对标真链（摘录，可压缩；不把冰淇淋物件画进来）：
#   Travel Town Ice Cream = Vanilla→Watermelon→Kiwi→RainbowPop→Cone→StrawberryCone→BigCone→Luxury→SimpleSundae→DeluxeSundae
# 抽链型=同店形变换代；抽曲线=朴素完整小件→条形换代→盛器→包装→礼赠器皿→带用具的高级件→成套盘→顶档盛宴。
# 本链 8 档压缩对应：单果→木签串→叶盏→小口瓶→宽肩礼瓶→木匙罐→双罐盘→叶缘盛宴。
# 版式参考 ref_merge_birds_sheet.png：2 行 4 列白圆角卡、深灰底。垫图只锁版式。禁止抄鸟、蛋、羽毛。
# 文字风格优先：软塑胶厚实圆润，棚柔光，短接触影，饱和但不油亮。
# 五问：
# 1 同店=妖精花园甜品店；家族=露莓洋红+叶绿+奶油酱色相，不是纹样盖章。对标是冰淇淋真档序，不是自拟果酱假名。
# 2 无回退：球→横串→叶舟→细高瓶→宽肩礼瓶→敞口罐+横匙→椭圆盘→最宽盛宴。L8 仍是果酱盛宴，不是退回 L3 小叶盏。
# 3 无跨店硬跳、无城堡。L3→L4 是两盏鲜莓熬成一瓶果酱，叶舟换成竖直瓶，64px 可分。
# 4 L1 只是一颗完整小果，玻璃/丝带/木匙/礼盘/盛宴都晚出现。邻档剪影类不同。
# 5 每档 merge_why 写两件同级合成后为何变成下一件，可倒推。L4→L5 是换瓶型（细颈消失、大结改外轮廓），不是同一瓶子贴一条细带。
# 6 每档一件可单独上架的货。L2 是木签串不是两颗散果；L7 是一只礼盘不是两个 L6 贴在一起。
# 7 合两下能倒推。末档是同店盛宴盘，对标冰淇淋链确有 Deluxe 盛宴段，不是另链地标。
