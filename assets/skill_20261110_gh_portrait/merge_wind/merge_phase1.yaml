# 花园管乐器八档合成梯整表 · 第 1 稿
# chain_mode=shop_ladder；delivery=overview_sheet；levels=8
# 版式：4×2（四行两列）。阅读 L1 L2 / L3 L4 / L5 L6 / L7 L8。画幅 9:16。
# 过程类型：原料→一份→盛器→套装。每一档仍是一件完整可合的管乐器，不是半成品车间。
# 商业对标真链：Gossip Harbor 茶链：叶→杯→冰茶→柠檬冰茶→甜冰茶→茶壶→茶会套装
# 本链八档展开：短哨=原料，开孔直管=一份，喇叭口笛子/加键长笛/双管笛=一份逐档换代，
# 立式风管排→小键盘风琴=盛器，节庆风琴套装=套装。
# 垫图只锁风格、构图、特征：光泽卡通 3D、圆润厚实、无硬描边、暖饱和、柔光、竖屏、每格一件完整乐器。
# 浅色圆角格，接近棋盘浅蓝。画面主体框高大约 0.48、0.55、0.62、0.69、0.76、0.83、0.89、0.94，末档最大。
# 机读 scale_pct 落在门禁内的最近单调列，出图仍按上面的框高画。
# 五问：
# 1 同店=花园管乐器；家族=叶绿与奶油色相，不是纹样盖章。过程类型是原料→一份→盛器→套装。对标是上面的茶链真档序。surface 是 Gossip Harbor 货柜气质。
# 2 无回退：短哨→直管→喇叭口→键盖横笛→双管→立管排→键盘箱→节庆套装。后档不退回更短更素的前档物件类。
# 3 无缺过渡硬跳，末档仍是同一管乐套装，不另焊地标。
# 4 低档是完整小短哨，琴键、立管排、彩带与谱架晚出现。邻档剪影大类不同，64px 可分。
# 5 每档 merge_why 写两件同级合成后为何变成下一件，可倒推。
# 6 每档一件独立 SKU。双管是一件双管笛，风管排是一件立式管列，套装是一件节庆货。
# 7 合两下能倒推。末档对标茶会套装，是同链犒赏，不是另一条链。
