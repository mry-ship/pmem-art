# Brimwave Café「港湾海鲜拼盘」合成梯 · shop_ladder L1–L8（overview_sheet 4×2 竖屏）
# 第 1 稿。新开 suite，不复用 assets/skill_* 旧海鲜关系稿/成图。
# 过程类型：A 同族形变货柜（同店完整 SKU 换代）。小鱼→鱼盘→熟鱼→碗→拼盘→龙虾→大餐→盛宴托盘。
# 商业对标真链（Gossip Harbor Seafood 7 扩到 8）：
#   Small Fish → Fish Plate → Prepared Fish → Seafood Bowl → Platter → Lobster Dish → Feast
#   压缩扩写末档为 FeastTraySet。
# 风格：垫真机锁画风（ref_merge.png 主垫 + ref_merge_strip.png 货条）跟截图货面，勿灌缺省软糖釉长句。
# 版式：竖屏商店垫图 → 4×2、浅奶油圆角卡、9:16。
# 五问：
# 1 同店=Brimwave Café 港湾海鲜拼盘货柜；家族=珊瑚红+奶油白+冰蓝+暖金。对标是 GH Seafood 真档序，不是自拟假名。
# 2 无回退：裸鱼→浅盘双鱼→熟整鱼→碗装→大盘拼→龙虾冰碗→大餐盘→盛宴托盘。L8 仍是同店海鲜盛宴。
# 3 无跨店硬跳、无城堡。邻档剪影/件数/容器不同，64px 可分。L1 不过满，犒赏在后段。
# 4 升级理由具体：每档 merge_why 写两件同级合成后为何变成下一件。
# 5 邻档至少变剪影/件数/容器/完成态之一；中段加件可读；合两下可倒推。
