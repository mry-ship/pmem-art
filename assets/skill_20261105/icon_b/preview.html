<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>icon_b Soft SVG preview</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 24px; background: #0f1419; color: #e8eef5; }
    h1 { font-size: 18px; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; margin-top: 20px; }
    .card { background: #1a222c; border-radius: 12px; padding: 16px; text-align: center; }
    .sizes { display: flex; gap: 12px; justify-content: center; align-items: flex-end; margin-top: 10px; color: #9ad0ff; }
    .label { margin-top: 8px; font-size: 13px; opacity: 0.85; }
    .meta { font-size: 12px; opacity: 0.65; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Mode B · Soft 2px · currentColor · 24 grid</h1>
  <p class="meta">battery1105 · home / shop / bag / settings</p>
  <div class="grid" id="grid"></div>
  <script>
    const icons = ["home", "shop", "bag", "settings"];
    const grid = document.getElementById("grid");
    icons.forEach(async (name) => {
      const svg = await (await fetch(name + ".svg")).text();
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<div class="sizes">
        <span style="width:24px;height:24px">${svg}</span>
        <span style="width:32px;height:32px">${svg}</span>
        <span style="width:48px;height:48px">${svg}</span>
      </div><div class="label">${name}.svg</div><div class="meta">24 / 32 / 48</div>`;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
