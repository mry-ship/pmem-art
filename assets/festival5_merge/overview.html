<!DOCTYPE html>

<style>
:root{--bg:#12161e;--panel:#1c2430;--text:#e8eef6;--muted:#93a4b8;--line:#314255}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1000px 500px at 15% -10%,#243247 0%,var(--bg) 55%);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;padding:20px}
h1{font-size:20px;margin:0 0 6px}
p{color:var(--muted);font-size:13px;margin:0 0 18px}
h2{font-size:14px;margin:18px 0 8px;color:var(--muted);font-weight:600}
.board img{width:min(100%,1100px);height:auto;border-radius:12px;border:1px solid var(--line);background:#0b1016}
.row{display:flex;gap:10px;flex-wrap:wrap}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
img.cell{width:128px;height:128px;object-fit:contain;display:block}
figcaption{font-size:12px;color:var(--muted);margin-top:4px}
</style>
